{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <meta name="description" content="">
    <meta name="keywords" content="">


    <!-- Favicons -->
    <link href="{% static 'assets/img/logo/logo6.png' %}" rel="icon" style="width: 64px; height: 64px;">
    <link href="{% static 'assets/img/logo/logo6.png' %}" rel="apple-touch-icon" style="width: 64px; height: 64px;">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">

    <!-- Main CSS File -->
    <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">

<link href="{% static 'assets/css/investmetrics-intelligence.css' %}" rel="stylesheet">

    <script src="https://unpkg.com/htmx.org@1.6.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Primary Meta Tags -->
    <title>Home</title>
    <meta name="title" content="Home" />
    <meta name="description" content="At Investmetrics, we're dedicated to harnessing the full potential of data through cutting-edge technologies and expert research." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://investmetrics.co.tz/" />
    <meta property="og:title" content="Home" />
    <meta property="og:description" content="At Investmetrics, we're dedicated to harnessing the full potential of data through cutting-edge technologies and expert research." />
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'assets/img/logo/logo5.png' %}" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://investmetrics.co.tz/" />
    <meta property="twitter:title" content="Home" />
    <meta property="twitter:description" content="At Investmetrics, we're dedicated to harnessing the full potential of data through cutting-edge technologies and expert research." />
    <meta property="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'assets/img/logo/logo5.png' %}" />

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="Investmetrics">
    <meta itemprop="description" content="At Investmetrics, we're dedicated to harnessing the full potential of data through cutting-edge technologies and expert research.">
    <meta itemprop="image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'assets/img/logo/logo7.png' %}">

    
</head>
<body>

  {% include 'navbar.html' %}

  {% block content %}

  {% block extra_css %}
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 500px;
      border-radius: 5px;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }

    .map-container {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 aspect ratio */
        height: 0;
        overflow: hidden;
    }

    .map-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .text-justify {
        text-align: justify;
    }
  </style>
  {% endblock %}

  {% block extra_js %}
  {% endblock %}

  {% endblock content %}

  {% include 'footer.html' %}

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="{%static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>
  <script src="{% static 'assets/vendor/aos/aos.js' %}"></script>
  <script src="{% static 'assets/vendor/swiper/swiper-bundle.min.js' %}"></script>
  <script src="{% static 'assets/vendor/glightbox/js/glightbox.min.js' %}"></script>
  <script src="{% static 'assets/vendor/imagesloaded/imagesloaded.pkgd.min.js' %}"></script>
  <script src="{% static 'assets/vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>
  <script src="{% static 'assets/vendor/purecounter/purecounter_vanilla.js' %}"></script>


  <!-- Main JS File -->
  <script src="{% static 'assets/js/main.js' %}"></script>


</html>
