    <!-- Add this at the end of your contact.html file -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contact-form');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                fetch('{% url "contact" %}', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                    }
                })
                .then(response => response.json())
                .then(data => {
                    loadingDiv.style.display = 'none';
                    if (data.success) {
                        sentMessageDiv.style.display = 'block';
                        form.reset();
                    } else {
                        console.log('Form errors:', data.errors); // Add this line
                        errorMessageDiv.textContent = 'Please correct the errors below:';
                        errorMessageDiv.style.display = 'block';
                        
                        // Display field-specific errors
                        for (const [field, errors] of Object.entries(data.errors)) {
                            const inputField = form.querySelector(`[name="${field}"]`);
                            if (inputField) {
                                const errorSpan = inputField.nextElementSibling || document.createElement('span');
                                errorSpan.className = 'error-message';
                                errorSpan.textContent = errors[0].message;
                                if (!inputField.nextElementSibling) {
                                    inputField.parentNode.insertBefore(errorSpan, inputField.nextSibling);
                                }
                            }
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again later.');
                });
            });
        });
    </script>
